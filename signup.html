<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!--Meta tags for search enginges-->
    <meta name="description" content="Love Running. Club for runners in Austria, Vienna. Urban running, trail running. Vienna City and Prater.">
    <meta name="keywords" content="love running, run, running, club, Austria, Vienna, sport, exercise">
    <!--Title-->
    <title>Love Running</title>
    <!--Favicon-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"/>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"/>

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"/>

    <!--Stylesheet-->
    <link rel="stylesheet" href="assets/css/style.css">
  </head>


  <body>
    <!--Header-->
    <header>
      <a href="index.html">
        <h1 id="logo">Love Running</h1>
      </a>
      <input type="checkbox" id="nav-toggle" name="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label"><i class="fa-solid fa-bars"></i></label>
      <nav>
        <ul id="menu">
          <li><a href="index.html" >Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="signup.html" class="active">Sign up</a></li>
        </ul>
      </nav>
    </header>

    <!--Main content-->
    <main>
      <section id="signup">
        <form method="POST" action="https://formdump.codeinstitute.net" id="signup-form">
          <h2> <i class="fa-solid fa-heart-pulse"></i>Let's get you signed up!</h2>

          <label for="first-name">First Name</label>
          <input class="text-input" type="text" id="first-name" name="first_name" required><br>
          <label for="last-name">Last Name</label>
          <input class="text-input" type="text" id="last-name" name="last_name" required><br>
          <label for="email-address">E-Mail Address</label>
          <input class="text-input" type="email" id="email-address" name="email_address" required><br>
          
          <div class="radio-buttons">
            <div>
              <label for="road">Road</label>
              <input type="radio" name="running_preference" id="road" value="road" required checked>
            </div>
            <div>
              <label for="trail">Trail</label>
              <input type="radio" name="running_preference" id="trail" value="trail" required>
            </div>
            <div>
              <label for="both">Both</label>
              <input type="radio" name="running_preference" id="both" value="both" required>
            </div>
          </div>
          <button type="submit" class="join-button">Let's Run!</button>
        </form>
      </section>
    </main>

    <!--Footer-->
    <footer>
      <ul id="social-networks">
        <li><a href="https://www.facebook.com" target="blank"  rel="noopener" 
          aria-label="Visit our Facebook page (opens in a new tab)">
          <i class="fa-brands fa-facebook"></i></a></li>
      
        <li><a href="https://www.twitter.com" target="blank"  rel="noopener" 
          aria-label="Visit our Twitter page (opens in a new tab)">
          <i class="fa-brands fa-twitter"></i></a></li>
      
        <li><a href="https://www.youtube.com" target="blank"  rel="noopener" 
          aria-label="Visit our YouTube page (opens in a new tab)">
          <i class="fa-brands fa-youtube"></i></a></li>
      
        <li><a href="https://www.instagram.com" target="blank"  rel="noopener" 
          aria-label="Visit our Instagram page (opens in a new tab)">
          <i class="fa-brands fa-instagram"></i></a></li>
      </ul>
    </footer>

    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/1738b2b29a.js" crossorigin="anonymous"></script>
  </body>
</html>
